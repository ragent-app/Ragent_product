name: Build Linux and macOS candidates
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Public release version (same as Windows)
        required: true
        default: '0.0.1'
        type: string
      build_version:
        description: Internal package build version (must increase on every rebuild)
        required: true
        default: '0.0.81'
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
          - runner: macos-15
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache-dependency-path: p2p/go.sum
      - name: Validate and build candidate
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_VERSION: ${{ inputs.build_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          export RAGENT_PACKAGE_VERSION="$RELEASE_VERSION"
          export RAGENT_PACKAGE_BUILD_VERSION="$BUILD_VERSION"
          # Release candidates must use the production transport endpoints even
          # when the build environment defines package endpoint overrides.
          export RAGENT_PACKAGE_PUBLIC_BASE_URL="https://app.agentoncloud.com"
          export RAGENT_PACKAGE_ACCOUNTS_URL="https://ragent.agentoncloud.com/accounts"
          export RAGENT_PACKAGE_ACCOUNTS_JWKS_URL="https://ragent.agentoncloud.com/accounts/.well-known/jwks.json"
          export RAGENT_PACKAGE_TURN_BROKER_URL="https://ragent.agentoncloud.com/turn"
          export RAGENT_PACKAGE_SIGNALING_URL="https://ragent.agentoncloud.com/signal"
          export RAGENT_NODE_CACHE_DIR="$RUNNER_TEMP/node-cache"
          export RAGENT_DEB_OUTPUT_DIR="$RUNNER_TEMP/ragent-release"
          export RAGENT_DMG_OUTPUT_DIR="$RUNNER_TEMP/ragent-release"
          export ELECTRON_CACHE="$RUNNER_TEMP/electron-cache"
          mkdir -p "$RAGENT_NODE_CACHE_DIR" "$RAGENT_DEB_OUTPUT_DIR" "$ELECTRON_CACHE"
          node tests/test-desktop-update.cjs
          node tests/test-runtime-payload-secret-scan.mjs
          node tests/test-frozen-source-guards.mjs
          node tests/test-semantic-darwin-preview.mjs
          if [ "$PLATFORM" = linux ]; then
            node tests/test-runner-sandbox.mjs
            node tests/test-read-only-run-sandbox.mjs
            node tests/test-read-only-provider-home.mjs
            node tests/test-semantic-operation.mjs
            node tests/test-semantic-compiler.mjs
            node tests/test-semantic-policy.mjs
            node tests/test-semantic-approval.mjs
            node tests/test-semantic-capability.mjs
            node tests/test-deb-packaging.mjs
            sudo env "PATH=$PATH" "TMPDIR=$RUNNER_TEMP" node tests/test-linux-run-status-ownership.mjs
            bash scripts/build-deb.sh
            asset="ragent_${RELEASE_VERSION}_amd64.deb"
            [ "$(dpkg-deb --field "$RAGENT_DEB_OUTPUT_DIR/$asset" Package)" = ragent ]
            [ "$(dpkg-deb --field "$RAGENT_DEB_OUTPUT_DIR/$asset" Version)" = "$BUILD_VERSION" ]
            [ "$(dpkg-deb --field "$RAGENT_DEB_OUTPUT_DIR/$asset" Architecture)" = amd64 ]
            package_check="$RUNNER_TEMP/ragent-package-check"
            dpkg-deb --extract "$RAGENT_DEB_OUTPUT_DIR/$asset" "$package_check"
            account_env="$package_check/etc/ragent/account-auth.env"
            signal_env="$package_check/etc/ragent/connectivity.env"
            grep -Fx 'RAGENT_PUBLIC_BASE_URL=https://app.agentoncloud.com' "$account_env"
            grep -Fx 'RAGENT_ACCOUNTS_URL=https://ragent.agentoncloud.com/accounts' "$account_env"
            grep -Fx 'RAGENT_ACCOUNTS_JWKS_URL=https://ragent.agentoncloud.com/accounts/.well-known/jwks.json' "$account_env"
            grep -Fx 'RAGENT_TURN_BROKER_URL=https://ragent.agentoncloud.com/turn' "$account_env"
            grep -Fx 'RAGENT_P2P_SIGNALING_URL=https://ragent.agentoncloud.com/signal' "$signal_env"
            (cd "$RAGENT_DEB_OUTPUT_DIR" && sha256sum "$asset" > SHA256SUMS.txt)
          else
            [ "$(uname -m)" = arm64 ]
            bash tests/test-macos-service-identity.sh
            bash tests/test-macos-runtime-layout.sh
            bash tests/test-macos-first-run.sh
            bash tests/test-macos-launcher.sh
            node tests/test-macos-login.cjs
            node tests/test-macos-package-preview.mjs
            bash scripts/build-dmg.sh
            asset="ragent_${RELEASE_VERSION}-darwin-arm64.dmg"
            mountpoint="$RUNNER_TEMP/ragent-dmg-check"
            mkdir -p "$mountpoint"
            hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$RAGENT_DMG_OUTPUT_DIR/$asset"
            trap 'hdiutil detach "$mountpoint" >/dev/null || true' EXIT
            app="$mountpoint/Ragent.app"
            [ -d "$app" ]
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = Ragent ]
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_VERSION" ]
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$BUILD_VERSION" ]
            codesign --verify --deep --strict "$app"
            hdiutil detach "$mountpoint"
            trap - EXIT
            (cd "$RAGENT_DMG_OUTPUT_DIR" && shasum -a 256 "$asset" > SHA256SUMS.txt)
          fi
          digest="$(awk '{print $1}' "$RAGENT_DEB_OUTPUT_DIR/SHA256SUMS.txt")"
          commit="$(git rev-parse --verify HEAD)"
          printf '<!-- ragent-asset-build:%s:%s:%s:sha256:%s -->\n' "$asset" "$BUILD_VERSION" "$commit" "$digest" > "$RAGENT_DEB_OUTPUT_DIR/BUILDINFO.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ragent-${{ matrix.platform }}-candidate
          path: ${{ runner.temp }}/ragent-release/
          if-no-files-found: error
          retention-days: 7
